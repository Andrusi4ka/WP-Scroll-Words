# Publishes a release with wp-scroll-words.zip for every "vX.Y.Z" tag; sites with
# the plugin then see the update under Plugins (wp-scroll-words.php: wpsw_updates()).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K\S+' wp-scroll-words.php)
          constant=$(grep -m1 -oP "define\(\s*'WPSW_VERSION',\s*'\K[^']+" wp-scroll-words.php)
          stable=$(grep -m1 -oP '^Stable tag:\s*\K\S+' readme.txt)
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag, Version $header, WPSW_VERSION $constant and readme.txt Stable tag $stable must match."
            exit 1
          fi

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      # git archive leaves out what .gitattributes marks export-ignore (dev files).
      - name: Build wp-scroll-words.zip
        run: |
          mkdir build
          git archive --format=tar --prefix=wp-scroll-words/ HEAD | tar -x -C build
          cd build
          zip -qr ../wp-scroll-words.zip wp-scroll-words

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: wp-scroll-words.zip
          generate_release_notes: true
